<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tsuki UI Regression Preview</title></head>
  <body>
    <div id="root"></div>
    <script type="module">
