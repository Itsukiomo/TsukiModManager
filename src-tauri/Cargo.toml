[package]
name = "tsukimodmanagerapp"
version = "2.0.3"
description = "Tsuki Mod Manager"
authors = ["you"]
edition = "2021"

[lib]
name = "tsukimodmanagerapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
zip = "2"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }

# Built-in 7z extraction. RAR still uses external/bundled tools unless a safe pure-Rust option is added.
sevenz-rust = "0.6.1"

sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2.2"
fs2 = "0.4"
quick-xml = "0.39.4"
time = { version = "0.3", features = ["parsing"] }
tauri-plugin-dialog = "2.7.1"
